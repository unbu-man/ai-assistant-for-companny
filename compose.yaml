services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: company_ai_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${COMPANY_AI_DB_ADMIN_PASSWORD:?set COMPANY_AI_DB_ADMIN_PASSWORD}"
      COMPANY_AI_DB_APP_PASSWORD: "${COMPANY_AI_DB_APP_PASSWORD:?set COMPANY_AI_DB_APP_PASSWORD}"
    volumes:
      - demo_database:/var/lib/postgresql/data
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d company_ai_demo"]
      interval: 2s
      timeout: 5s
      retries: 20
  initialize:
    image: company-ai-local
    build: .
    environment:
      COMPANY_AI_ADMIN_DATABASE_URL: "host=db dbname=company_ai_demo user=postgres"
      PGPASSWORD: "${COMPANY_AI_DB_ADMIN_PASSWORD:?set COMPANY_AI_DB_ADMIN_PASSWORD}"
    command: ["sh", "-ec", "company-ai-mvp migrate && company-ai-mvp grant-runtime company_ai_runtime && company-ai-mvp seed-demo"]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: company-ai-local
    build: .
    environment:
      COMPANY_AI_DEMO: "1"
      COMPANY_AI_DATABASE_URL: "host=db dbname=company_ai_demo user=company_ai_runtime"
      PGPASSWORD: "${COMPANY_AI_DB_APP_PASSWORD:?set COMPANY_AI_DB_APP_PASSWORD}"
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      initialize:
        condition: service_completed_successfully
volumes:
  demo_database:
