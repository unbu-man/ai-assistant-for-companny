<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ecf2ed">
  <title>Company Support</title>
  <link rel="stylesheet" href="/assets/chat.css">
  <script src="/assets/chat.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="page-head">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Company Support</span></div>
      <label class="language" for="language"><span id="language-label">Reply language</span>
        <select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="km" lang="km">ខ្មែរ</option></select>
      </label>
    </header>
    <div class="workspace">
      <aside class="intro">
        <div class="intro-content">
          <h1 id="intro-title">How can we help?</h1>
          <p id="intro-text">Ask about products or get help with your next step.</p>
          <label class="company-choice" for="company"><span id="company-label">Company</span><select id="company" disabled></select></label>
        </div>
        <p id="demo-note" class="demo-note" hidden>Demo mode · Use sample details only.</p>
      </aside>
      <section class="chat" aria-label="Support chat" id="chat-panel">
        <header class="chat-head"><span class="dot" aria-hidden="true"></span><h2 id="chat-title">Support chat</h2><button type="button" id="reset" class="quiet" disabled>New chat</button></header>
        <div class="conversation" id="conversation" role="log" aria-live="polite" aria-relevant="additions"></div>
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="suggestions" class="suggestions" aria-label="Suggested questions"></div>
        <details id="faq-picker" hidden>
          <summary id="faq-label">Browse verified questions</summary>
          <div id="faq-topics" class="faq-topics"></div>
        </details>
        <form id="chat-form">
          <details id="technical"><summary id="technical-label">Product and version</summary>
            <div class="fields">
              <label><span id="product-label">Product</span><input id="product" maxlength="120"></label>
              <label><span id="version-label">Version</span><input id="version" maxlength="120"></label>
            </div>
          </details>
          <div class="composer">
            <label class="visually-hidden" id="message-label" for="message">Your question</label>
            <textarea id="message" placeholder="Ask a question…" rows="2" maxlength="900" required disabled></textarea>
            <button type="submit" id="send" disabled>Send</button>
          </div>
        </form>
        <form id="quote-form" hidden>
          <div id="quote-fields" class="fields"></div>
          <div id="quote-buttons" class="quote-buttons"></div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
